{% extends 'base.html' %}
{% load i18n %}

{% block title %}Visitor Self Registration - Photo{% endblock %}

{% block content %}
<div class="login-container p-4">
  <div class="max-w-3xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow p-6">
    <div class="text-center mb-6">
      <img src="/media/logos/sctlogo-white.png" alt="SmartCity" class="h-10 mx-auto mb-3" />
      <h1 class="text-2xl font-bold">Capture Face Photo</h1>
      <p class="text-gray-600 dark:text-gray-400">Photo size must be under 200 KB.</p>
      <p class="text-sm text-gray-500 dark:text-gray-400">Pass Number: <strong>{{ pass_number }}</strong></p>
    </div>

    <div>
      <label class="block text-sm font-medium mb-2">Camera</label>
      <video id="video" autoplay playsinline class="w-full rounded-lg bg-black"></video>
      <div class="mt-3 grid grid-cols-2 gap-3">
        <button type="button" id="startCam" class="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Start Camera</button>
        <button type="button" id="capture" class="w-full px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">Capture</button>
      </div>
      <p id="capture-status" class="mt-2 text-sm text-gray-600 dark:text-gray-400"></p>
      <div class="mt-4 w-full flex justify-center">
        <button type="button" id="upload" class="w-full max-w-sm px-5 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Upload</button>
      </div>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">Ensure your face is clear and centered in the frame.</p>
      <!-- Hidden canvas used internally for capture/compression -->
      <canvas id="canvas" class="hidden"></canvas>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const startCam = document.getElementById('startCam');
const captureBtn = document.getElementById('capture');
const uploadBtn = document.getElementById('upload');
const captureStatus = document.getElementById('capture-status');
// No preview/retake UI; keep it simple
let stream;
let lastDataUrl = null;

startCam.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    alert('Cannot open camera: ' + (e && e.message ? e.message : e));
  }
});

function compressToUnder200KB() {
  const w = video.videoWidth || 640;
  const h = video.videoHeight || 480;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);
  let quality = 0.9;
  let dataUrl = canvas.toDataURL('image/jpeg', quality);
  let sizeKB = Math.round((dataUrl.length * 3 / 4) / 1024);
  // Reduce quality until under 200KB or minimum threshold
  while (sizeKB > 200 && quality > 0.5) {
    quality -= 0.07;
    dataUrl = canvas.toDataURL('image/jpeg', quality);
    sizeKB = Math.round((dataUrl.length * 3 / 4) / 1024);
  }
  lastDataUrl = dataUrl;
  return sizeKB;
}

captureBtn.addEventListener('click', async () => {
  if (!stream) { alert('Start the camera first'); return; }
  if (!video.videoWidth || !video.videoHeight) {
    await new Promise(r => setTimeout(r, 200));
  }
  const sizeKB = compressToUnder200KB();
  if (captureStatus) {
    captureStatus.textContent = 'Captured ✓ Size ~ ' + sizeKB + ' KB';
  }
});

uploadBtn.addEventListener('click', async () => {
  if (!lastDataUrl) { alert('Capture a photo first'); return; }
  const formData = new FormData();
  formData.append('pass_number', '{{ pass_number }}');
  formData.append('face_image_data', lastDataUrl);
  try {
    const resp = await fetch('{% url "visitors:self_register_upload_face_api" %}', {
      method: 'POST',
      body: formData
    });
    const data = await resp.json();
    if (resp.ok && data.status === 'success') {
      window.location.href = '{% url "visitors:self_register_success" pass_number=pass_number %}';
    } else {
      alert('Upload failed: ' + (data.message || resp.status));
    }
  } catch (e) {
    alert('Network error during upload: ' + (e && e.message ? e.message : e));
  }
});
</script>
{% endblock %}
