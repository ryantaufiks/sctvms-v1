<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="780" viewBox="0 0 1300 780">
  <style>
    .actor { font: 600 14px Arial, sans-serif; fill:#111; }
    .label { font: 12px Arial, sans-serif; fill:#333; }
    .lifeline { stroke:#bbb; stroke-dasharray:4 4; }
    .arrow { stroke:#333; stroke-width:1.5; marker-end:url(#arrow); }
    .note { fill:#e0f2fe; stroke:#38bdf8; rx:6; ry:6; }
    .warn { fill:#fee2e2; stroke:#ef4444; rx:6; ry:6; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
  </defs>

  <!-- Actors -->
  <text x="100" y="30" class="actor">Security Officer</text>
  <line x1="120" y1="50" x2="120" y2="740" class="lifeline"/>

  <text x="400" y="30" class="actor">Visitors App (Verify View)</text>
  <line x1="420" y1="50" x2="420" y2="740" class="lifeline"/>

  <text x="700" y="30" class="actor">PreRegistration/Visitor Models</text>
  <line x1="720" y1="50" x2="720" y2="740" class="lifeline"/>

  <text x="1000" y="30" class="actor">Cache/Throttle</text>
  <line x1="1020" y1="50" x2="1020" y2="740" class="lifeline"/>

  <!-- Interactions -->
  <line x1="120" y1="100" x2="420" y2="100" class="arrow" />
  <text x="150" y="90" class="label">Enter 6-digit OTP / scan QR</text>

  <line x1="420" y1="140" x2="1020" y2="140" class="arrow" />
  <text x="560" y="130" class="label">Throttle check (10/min per user+IP)</text>

  <line x1="420" y1="180" x2="720" y2="180" class="arrow" />
  <text x="470" y="170" class="label">Lookup PreRegistration by OTP</text>

  <rect x="460" y="210" width="360" height="70" class="warn"/>
  <text x="470" y="232" class="label">Reject if: not found, already used, or expired</text>
  <text x="470" y="252" class="label">Return error message and do not proceed</text>

  <line x1="420" y1="300" x2="720" y2="300" class="arrow" />
  <text x="470" y="290" class="label">Validate time window (±1h / +3h)</text>

  <line x1="720" y1="340" x2="420" y2="340" class="arrow" />
  <text x="470" y="330" class="label">OK → Mark is_verified=True, set verified_by/at</text>

  <rect x="740" y="360" width="280" height="70" class="note"/>
  <text x="750" y="382" class="label">Visitor.save() may set check_in_time</text>
  <text x="750" y="402" class="label">if not already set</text>

  <line x1="420" y1="450" x2="120" y2="450" class="arrow" />
  <text x="180" y="440" class="label">Respond with success + visitor pass info</text>

  <line x1="120" y1="510" x2="420" y2="510" class="arrow" />
  <text x="160" y="500" class="label">Print pass (optional)</text>

  <line x1="420" y1="550" x2="720" y2="550" class="arrow" />
  <text x="450" y="540" class="label">Generate printable QR for pass_number</text>
</svg>